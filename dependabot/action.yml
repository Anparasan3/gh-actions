name: 'Ensure Dependabot'
description: 'Creates .github/dependabot.yml in the consuming repo if it is missing, then commits and pushes it'

runs:
  using: 'composite'
  steps:
    - name: Ensure dependabot.yml
      shell: bash
      run: |
        if [ -f .github/dependabot.yml ]; then
          echo "dependabot.yml already present, skipping"
          exit 0
        fi

        mkdir -p .github
        cat > .github/dependabot.yml <<'EOF'
        version: 2
        updates:
          - package-ecosystem: "bun"
            directory: "/"
            schedule:
              interval: daily
              time: '00:00'
              timezone: UTC
            open-pull-requests-limit: 10
            commit-message:
              prefix: "Dependabot"
              include: "scope"

          - package-ecosystem: "github-actions"
            directory: "/"
            schedule:
              interval: daily
              time: '00:00'
              timezone: UTC
            open-pull-requests-limit: 10
            commit-message:
              prefix: "Dependabot"
              include: "scope"
        EOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/dependabot.yml
        git commit -m "chore: add dependabot.yml"
        git push origin HEAD:${{ github.ref_name }}
