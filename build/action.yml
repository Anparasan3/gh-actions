name: 'Build'
description: 'Runs the project build script via Bun'

inputs:
  working-directory:
    description: 'Directory to run the build command in'
    required: false
    default: '.'
  script:
    description: 'The package.json script to run for building'
    required: false
    default: 'build'

runs:
  using: 'composite'
  steps:
    - name: Run build
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: bun run ${{ inputs.script }}
