name: 'Lint'
description: 'Runs the project lint script via Bun'

inputs:
  working-directory:
    description: 'Directory to run the lint command in'
    required: false
    default: '.'
  script:
    description: 'The package.json script to run for linting'
    required: false
    default: 'lint'

runs:
  using: 'composite'
  steps:
    - name: Run lint
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: bun run ${{ inputs.script }}
