# Reference copy of what the `dependabot` composite action writes.
# Dependabot config lives per-repo -- it cannot be "shared" via uses: --
# but example-ci-workflow.yml's `Anparasan3/gh-actions/dependabot` step
# creates this file automatically on first push to main if it's missing.
# Copy this file manually only if you want it without waiting for that push,
# or want to customize it before the bootstrap step would run.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: daily
      time: '00:00'
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Dependabot"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: '00:00'
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Dependabot"
      include: "scope"
