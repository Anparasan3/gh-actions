name: 'Test'
description: 'Runs the project test script via Bun'

inputs:
  working-directory:
    description: 'Directory to run the test command in'
    required: false
    default: '.'
  script:
    description: 'The package.json script to run for tests'
    required: false
    default: 'test'

runs:
  using: 'composite'
  steps:
    - name: Run tests
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: bun run ${{ inputs.script }}
